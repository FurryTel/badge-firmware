[package]
edition = "2024"
name = "badge-firmware"
version = "0.1.0"
authors = ["Matt Mullins <mmullins@mmlx.us>"]
#rust-version = "stable"

[dependencies]
embassy-embedded-hal = { version = "0.6.0", features = ["defmt"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp2040"] }
embassy-futures = { version = "0.1.2" }

defmt = "1.1"
defmt-rtt = "1.3"

cortex-m = { version = "0.7.9", features = ["inline-asm"] }
cortex-m-rt = "0.7.6"
panic-probe = { version = "1.0", features = ["print-defmt"] }
futures = { version = "0.3.34", default-features = false, features = ["async-await", "cfg-target-has-atomic", "unstable"] }
heapless = "0.9"


embedded-hal-1 = { package = "embedded-hal", version = "=1.0.0" }
embedded-hal-async = "1.0.0"
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
#embedded-storage = { version = "0.3" }
static_cell = "2"
portable-atomic = { version = "1.15", features = ["critical-section"] }
log = "0.4"
pio-proc = "0.3"
pio = "0.3.0"
rand = { version = "0.10.2", default-features = false }

[profile.release]
debug = 2

# Below configs are here to mute the rust-analyzer error.
# "Can't find crate for 'test'" as this is a no_std project
[[bin]]
name = "badge-firmware"
test = false
bench = false
